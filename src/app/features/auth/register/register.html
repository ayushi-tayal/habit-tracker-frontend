<main class="auth-page">
  <section class="auth-panel">
    <p class="auth-kicker">Start small</p>
    <h1>Sign up</h1>
    <p class="auth-intro">Create a calm place to keep track of the habits you are building.</p>
    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
            <label for="username">Name</label>
            <input id="username" formControlName="username" />
        </div>
        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" formControlName="email" />
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" type="password" formControlName="password" />
        </div>
        <div class="form-field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" formControlName="confirmPassword" />
        </div>
        <div class="form-field">
            <label for="phone">Phone</label>
            <input id="phone" formControlName="phone" />
        </div>
        <button class="auth-submit" type="submit">Create account <span aria-hidden="true">&rarr;</span></button>
    </form>

    <div class="auth-links">
        <p>Already have an account? <a routerLink="/login">Log in</a></p>
    </div>

    @if(loading$ | async) {
        <div class="auth-alert auth-loading">
            Loading...
        </div>
    }
    @if(error$ | async; as error) {
        <div class="auth-alert auth-error">
            {{ error }}
        </div>
    }


    </section>
</main>
