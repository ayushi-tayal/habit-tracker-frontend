<main class="auth-page">
  <section class="auth-panel">
    <p class="auth-kicker">Welcome back</p>
    <h1>Log in</h1>
    <p class="auth-intro">Return to the habits that help you feel like yourself.</p>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" formControlName="email" />
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" type="password" formControlName="password" />
        </div>
        <button class="auth-submit" type="submit">Log in <span aria-hidden="true">&rarr;</span></button>
    </form>
    <div class="auth-links">
        <p>Forgot your password? <a [routerLink]="['/forgot-password']" [queryParams]="{ email: loginForm.get('email')?.value }">Reset it</a></p>
        <p>No account yet? <a routerLink="/register">Create one</a></p>
    </div>
    @if(loading$ | async) {
        <div class="auth-alert auth-loading">
            Loading...
        </div>
    }
    @if(error$ | async; as error) {
        <div class="auth-alert auth-error">
            {{ error }}
        </div>
    }
  </section>
</main>
