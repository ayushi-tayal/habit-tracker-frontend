<main class="auth-page">
    <section class="auth-panel">
        <p class="auth-kicker">A fresh start</p>
        <h1>Reset password</h1>
        <p class="auth-intro">Choose a new password and get back to your routine.</p>

        <form class="auth-form" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
                <div class="form-field">
            <label for="password">New Password</label>
            <input id="password" type="password" formControlName="password" />
            <div *ngIf="resetPasswordForm.get('password')?.hasError('minlength') && resetPasswordForm.get('password')?.touched" class="auth-alert auth-error">
                Password must be at least 8 characters long.
            </div>
            <div *ngIf="resetPasswordForm.get('password')?.hasError('required') && resetPasswordForm.get('password')?.touched" class="auth-alert auth-error">
                Password is required.
            </div>
        </div>
        <div class="form-field">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" formControlName="confirmPassword" />
            <div *ngIf="resetPasswordForm.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.touched" class="auth-alert auth-error">
                Passwords do not match.
            </div>
        </div>
        <!-- </div> -->
        <button class="auth-submit" type="submit">Reset password <span aria-hidden="true">&rarr;</span></button>
  
    </form>
    <a class="auth-back" routerLink="/login">&larr; Back to login</a>
    </section>
</main>
