<section class="profile-panel">
    <div class="panel-heading">
        <div>
            <p class="section-kicker">Your space</p>
            <h2>Profile</h2>
        </div>
    </div>
    @if(loading$ | async){
    <p class="muted-message">Loading profile...</p>
    }
    @let error = error$ | async;
    @if(error$ | async) {
    <div class="error-message">{{error}}</div>
    }
    @let profile = profile$ | async;
    @if(profile) {
    <div class="profile-details">
        <img src="https://i.pravatar.cc/80" alt="Profile" class="profile-image" />
        <div class="profile-copy">
            <strong>{{profile.username}}</strong>
            <span>{{profile.email}}</span>
            <span>{{profile.phone}}</span>
        </div>
    </div>
    <button class="profile-button" [routerLink]="['/profile']" [queryParams]="{ user_id: profile?._id }">
        Edit profile <span aria-hidden="true">&rarr;</span>
    </button>
    }
</section>
