<div class="container mt-5" style="max-width: 420px;">
    <h2 class="mb-4">Edit Profile</h2>
    <form [formGroup]="editProfileForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="username">Name:</label>
            <input id="username" formControlName="username" />
        </div>
        <div>
            <label for="email">Email:</label>
            <input id="email" formControlName="email" />
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input id="phone" formControlName="phone" />
        </div>
        <div formGroupName="personal_info">
            <div>
                <label for="profession">Profession:</label>
                <input id="profession" formControlName="profession" />
            </div>
            <div>
                <label for="maritalStatus">Marital Status:</label>
                <input id="maritalStatus" formControlName="maritalStatus" />
            </div>
            <div formGroupName="address">
                <div>
                    <label for="street">Street:</label>
                    <input id="street" formControlName="street" />
                </div>
                <div>
                    <label for="city">City:</label>
                    <input id="city" formControlName="city" />
                </div>
                <div>
                    <label for="state">State:</label>
                    <input id="state" formControlName="state" />
                </div>
                <div>
                    <label for="pincode">Pincode:</label>
                    <input id="pincode" formControlName="pincode" />
                </div>
                <div>
                    <label for="country">Country:</label>
                    <input id="country" formControlName="country" />
                </div>
            </div>
        </div>

        <button type="submit">Submit</button>
    </form>

    <!-- @if(loading$ | async) {
        <div class="alert alert-info">
            Loading...
        </div>
    }
    @if(error$ | async; as error) {
        <div class="alert alert-danger">
            {{ error }}
        </div>
    } -->


</div>
