<main class="edit-profile-page">
    <section class="edit-profile-panel">
        <button type="button" class="profile-back" (click)="goBack()">&larr; Back to dashboard</button>
        <p class="form-kicker">Your details</p>
        <h1>Edit profile</h1>
        <p class="profile-intro">Keep your personal details up to date.</p>

        <form class="profile-form" [formGroup]="editProfileForm" (ngSubmit)="onSubmit()">
            <div class="profile-section">
                <h2>Basic information</h2>
                <div class="profile-fields profile-fields-two">
                    <div class="form-field">
                        <label for="username">Name</label>
                        <input id="username" formControlName="username" />
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" type="email" formControlName="email" />
                    </div>
                    <div class="form-field">
                        <label for="phone">Phone</label>
                        <input id="phone" formControlName="phone" />
                    </div>
                </div>
            </div>

            <div class="profile-section" formGroupName="personal_info">
                <h2>Personal information</h2>
                <div class="profile-fields profile-fields-two">
                    <div class="form-field">
                        <label for="profession">Profession</label>
                        <input id="profession" formControlName="profession" />
                    </div>
                    <div class="form-field">
                        <label for="marital_status">Marital status</label>
                        <input id="marital_status" formControlName="marital_status" />
                    </div>
                </div>

                <div class="address-fields" formGroupName="address">
                    <h3>Address</h3>
                    <div class="profile-fields profile-fields-two">
                        <div class="form-field address-wide">
                            <label for="street">Street</label>
                            <input id="street" formControlName="street" />
                        </div>
                        <div class="form-field">
                            <label for="city">City</label>
                            <input id="city" formControlName="city" />
                        </div>
                        <div class="form-field">
                            <label for="state">State</label>
                            <input id="state" formControlName="state" />
                        </div>
                        <div class="form-field">
                            <label for="pincode">Pincode</label>
                            <input id="pincode" formControlName="pincode" />
                        </div>
                        <div class="form-field">
                            <label for="country">Country</label>
                            <input id="country" formControlName="country" />
                        </div>
                    </div>
                </div>
            </div>

            <button class="profile-submit" type="submit">Save changes <span aria-hidden="true">&rarr;</span></button>
        </form>
    </section>
</main>
