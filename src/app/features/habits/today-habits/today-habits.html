<section class="habit-panel today-panel">
    <div class="panel-heading">
        <div>
            <p class="section-kicker">Today</p>
            <h2>Today's habits</h2>
        </div>
        <span class="date-label">Your focus</span>
    </div>

    <div class="habit-list">
        @for (habit of selectedHabits; track habit._id) {
        <label class="habit-item">
            <span>{{ habit.name }}</span>
            <input type="checkbox" [checked]="isHabitSelected(habit)"
                (change)="toggleHabit(habit, $any($event.target).checked)" /><span class="habit-check"></span>
        </label>
        }
    </div>
    <div class="panel-footer">
        @if(habitLog){
            <button type="submit" class="panel-button" (click)="update()">Update today's progress <span
                    aria-hidden="true">&rarr;</span></button>
        } @else {
            <button type="submit" class="panel-button" (click)="submit()">Save today's progress <span
                    aria-hidden="true">&rarr;</span></button>
        }

    </div>
</section>
